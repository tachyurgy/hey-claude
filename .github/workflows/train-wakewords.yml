name: Train wake words

# Trains openWakeWord models for the given phrases on a free GitHub-hosted
# runner (CPU) and uploads each <slug>.onnx as a downloadable artifact.
# Manual trigger only — this is a long, deliberate job.
on:
  workflow_dispatch:
    inputs:
      phrases:
        description: "Semicolon-separated wake phrases to train"
        required: true
        default: "hey claude;hey agent;hey codey;hey assistant;okay claude;hey computer"
      pos_speakers:
        description: "Positive speaker count per phrase (diversity vs. time)"
        required: false
        default: "150"
      steps:
        description: "Training steps per phrase"
        required: false
        default: "12000"
      fast:
        description: "Fast validation run (1 phrase, tiny data, no 16GB download)"
        type: boolean
        required: false
        default: false
      max_neg_weight:
        description: "Negative weight (lower = better recall on confusable words)"
        required: false
        default: "1500"
      target_fp:
        description: "Target false positives/hour (higher = better recall)"
        required: false
        default: "0.2"
      n_adv:
        description: "Adversarial negative phrases per word"
        required: false
        default: "200"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the negative-feature set is ~16 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch (CPU) + system audio libs
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          # torchaudio >=2.8 routes torchaudio.load() through torchcodec; 2.2.2 uses
          # the soundfile backend (no torchcodec native dep) and matches the era of
          # the openWakeWord training code.
          pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install training dependencies
        run: pip install -r training/requirements.txt

      - name: Train
        env:
          POS_SPEAKERS: ${{ github.event.inputs.pos_speakers }}
          STEPS: ${{ github.event.inputs.steps }}
          FAST: ${{ github.event.inputs.fast == 'true' && '1' || '0' }}
          MAX_NEG_WEIGHT: ${{ github.event.inputs.max_neg_weight }}
          TARGET_FP: ${{ github.event.inputs.target_fp }}
          N_ADV: ${{ github.event.inputs.n_adv }}
        run: |
          IFS=';' read -ra PHR <<< "${{ github.event.inputs.phrases }}"
          echo "Training: ${PHR[@]}"
          python training/train_wakewords.py "${PHR[@]}"

      - name: List models
        if: always()
        run: ls -la wakeword_models/ || echo "no models dir"

      - name: Upload trained models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wakeword-models
          path: wakeword_models/*.onnx
          if-no-files-found: warn
