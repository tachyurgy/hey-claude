name: Publish to PyPI

# Builds the sdist + wheel and publishes to PyPI when a GitHub release is
# published — via PyPI **Trusted Publishing** (OIDC), so no API token/secret is
# stored in the repo.
#
# ONE-TIME SETUP (on pypi.org, by the project owner):
#   PyPI → your project → Publishing → "Add a trusted publisher" → GitHub:
#     owner=tachyurgy  repo=hey-claude  workflow=pypi-publish.yml
#   (For the very first upload, register the publisher as a "pending" publisher
#   under your account before the project exists.)
# Until that's done, this workflow runs but the publish step is rejected — that's
# expected, not a code bug.

on:
  release:
    types: [published]
  workflow_dispatch:        # allow a manual re-run after the publisher is set up

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # required for OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
